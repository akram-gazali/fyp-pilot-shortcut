# Pilot defaults. NOT final until the protocol lock on 20 January.
seed: 0
image_size: 224
shapes: [square, circle, triangle]
colors: [red, blue, green, yellow, purple, orange]
min_objects: 3
max_objects: 8
size_range: [10, 18]      # half-extent in pixels
placement_margin: 3       # min gap (px) between bounding circles
# One scene = one scene group. Splits (Stage 3) assign whole scenes to train/pool/test.
n_scenes: 4000            # ~500 train + ~3000 pool + ~500 test
questions_per_scene: 2
# Template sampling weights (all four are generated; Stage 3 decides which are held out).
templates:
  count_cs: 1.0           # "How many blue squares are there?"
  exists_cs: 1.0          # "Is there a red circle?"
  compare_shape: 1.0      # "Are there more squares than triangles?"
  compare_cs: 1.0         # "Are there more blue squares than triangles?" (held-out combination)
# Per-scene palette: each scene uses a small random subset of the colours and shapes, and
# each object is the scene's "focus" colour+shape pair with probability p_focus, so that a
# queried pair often appears several times (answers spread over 0..5).
palette:
  n_colors: {1: 0.2, 2: 0.5, 3: 0.3}   # number of distinct colours in a scene: weight
  n_shapes: {1: 0.05, 2: 0.45, 3: 0.5}   # number of distinct shapes in a scene: weight
  p_focus: 0.7
# Question targets are chosen on purpose: pick a desired answer class first, then a
# colour/shape parameter that gives it (when the scene allows it).
count_zero_weight: 0.5   # sampling weight of answer class 0 relative to 1..5 (1.0 = equal)
count_max_target: 5       # count answers are targeted uniformly over feasible values in 0..5
p_yes: 0.5                # target share of "yes" for exists_cs, compare_shape, compare_cs

# Tuned with scripts/tune_generator.py on tuning seeds 1000/2000 (not the pool seed) so that each
# shortcut agrees with the intended answer on ~60-75% of the count/exists questions it applies to.
